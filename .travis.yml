# Documentation: http://docs.travis-ci.com/user/languages/julia
language: julia
notifications:
  email: false
julia:
  - 1.0
os:
  - linux
arch:
  - x64
cache:
  directories:
    - ~/.julia/artifacts
jobs:
  fast_finish: true
  allow_failures:
    - julia: nightly
env:
  - CODECOV_TOKEN='b3f05456-9386-4aed-a05e-38f7765e397c'
sudo: required
before_script:
  - echo starting;
    sudo apt-get install gfortran;
    echo $PWD;
    cd src/chides_fortran;
    echo $PWD;
    make;
    cp ../libchides.so ../../test/;
    echo done;
after_success:
  - |
    julia -e '
      using Pkg
      Pkg.add("Coverage")
      using Coverage
      Codecov.submit(process_folder())'
#    
#    make;
#    cd src/chides_fortran;
